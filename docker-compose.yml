# docker-compose.yml
# No `version:` key — Compose v2 auto-detects the format and the
# key has been deprecated since Compose v2.0 (emits a warning on
# every `docker compose` invocation when present).

name: interview-prep-ai

services:

  # ============================================================
  # Backend — Node.js Express API server
  # ============================================================
  backend:
    build:
      context: ./backend
    container_name: interview-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      app-network:
        aliases:
          - backend
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          node -e "require('http').get('http://localhost:8000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # ============================================================
  # Frontend — Nginx serving Vite-built React SPA
  #
  # depends_on backend removed: Nginx serves static files and
  # doesn't need the backend to be healthy to start. The browser
  # handles API errors if the backend is temporarily down.
  # Removing this unblocks parallel startup and prevents the
  # frontend container from being held until backend is healthy.
  # ============================================================
  frontend:
    build:
      context: ./frontend/interview-perp-ai
    container_name: interview-frontend
    ports:
      - "80:8080"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ============================================================
  # AI / RAG Service — Python FastAPI RAG pipeline
  # ============================================================
  ai:
    build:
      context: ./ai-training
    container_name: interview-ai
    ports:
      - "8001:8001"
    env_file:
      - ./ai-training/.env
    volumes:
      # Named volumes let Docker manage ownership, avoiding the
      # host-uid vs container-uid (1000) permission mismatch that
      # causes silent ChromaDB write failures with bind mounts.
      - chroma_data:/app/chroma_db
      - ai_logs:/app/logs
    networks:
      app-network:
        aliases:
          - ai
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 5
    restart: unless-stopped

# ============================================================
# Named volumes
# ============================================================
volumes:
  chroma_data:
    # Persists ChromaDB vector store across container restarts.
    # Using a named volume (instead of a bind mount) ensures the
    # container's uid 1000 always owns the directory.
  ai_logs:

# ============================================================
# Shared network
# ============================================================
networks:
  app-network:
    driver: bridge
