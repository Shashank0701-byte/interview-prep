name: Keep-Alive — Ping Backend

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping backend health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend /api/health
        env:
          SERVICE_URL: ${{ vars.RAILWAY_SERVICE_URL }}
        run: |
          if [ -z "$SERVICE_URL" ]; then
            echo "RAILWAY_SERVICE_URL is not set"
            exit 1
          fi
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            "$SERVICE_URL/api/health")
          echo "Backend response: $response"
          if [ "$response" != "200" ]; then
            echo "Backend health check failed with $response"
            exit 1
          fi
          echo "Backend is up"
