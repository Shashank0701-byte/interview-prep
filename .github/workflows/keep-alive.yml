name: Keep-Alive — Ping Backend & AI Bot

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  ping:
    name: Ping backend health
    runs-on: ubuntu-latest

    steps:
      - name: Ping backend /api/health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "${{ vars.RAILWAY_SERVICE_URL }}/api/health")
          echo "Backend response: $response"
          if [ "$response" = "200" ]; then
            echo "Backend is up"
          else
            echo "Warning: backend returned $response"
          fi

      - name: Ping chatbot /ai/health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "${{ vars.RAILWAY_CHATBOT_URL }}/ai/health")
          echo "Chatbot response: $response"
          if [ "$response" = "200" ]; then
            echo "Chatbot is up"
          else
            echo "Warning: chatbot returned $response"
          fi
