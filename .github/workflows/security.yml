name: Security — Audit & Secret Scan

on:
  push:
    branches: [main, dev, feat/**]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── npm audit — backend ──────────────────────────────────────
  # Split from frontend so both run in parallel and failures are
  # attributed to the right service immediately.
  audit-backend:
    name: npm audit (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install (no scripts, audit only)
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Audit
        working-directory: backend
        run: npm audit --audit-level=high

  # ── npm audit — frontend ─────────────────────────────────────
  audit-frontend:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/interview-perp-ai/package-lock.json

      - name: Install (no scripts, audit only)
        working-directory: frontend/interview-perp-ai
        # --legacy-peer-deps matches .npmrc; without it npm ci rejects
        # peer entries the lockfile intentionally omits.
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Audit
        working-directory: frontend/interview-perp-ai
        run: npm audit --audit-level=high

  # ── pip-audit — AI service ───────────────────────────────────
  pip-audit:
    name: pip audit (AI service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-training/requirements.txt

      - name: Audit Python dependencies
        working-directory: ai-training
        run: |
          python -m pip install --upgrade pip pip-audit
          # Audit both layers: base deps (torch/chromadb/etc.) and app deps.
          # chromadb advisories: still unfixed in latest release — remove ignores
          # when a patched chromadb version ships.
          pip-audit -r requirements-base.txt -r requirements.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

  # ── Trivy filesystem scan ────────────────────────────────────
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/trivy
        with:
          scan-type: fs
          target: .
          skip-dirs: node_modules,chroma_db

  # ── TruffleHog secret scan ───────────────────────────────────
  secret-scan:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use the correct base ref depending on event type:
      #   pull_request → diff against the PR base commit (accurate)
      #   push         → diff against the previous commit on the branch
      # Previously used github.event.repository.default_branch which is
      # wrong on force-pushes and the first commit on a new branch.
      - name: Run TruffleHog on git diff
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: HEAD
          extra_args: --only-verified

  # ── .env file guard ──────────────────────────────────────────
  env-file-check:
    name: Check for committed .env files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if secret env files are tracked
        run: |
          # Match .env, .env.local, .env.production, .env.test, etc.
          # Exclude *.env.example and *.env.example.* (template files)
          tracked=$(git ls-files \
            | grep -E '(^|/)\.(env|env\..+)$' \
            | grep -vE '\.env\.example(\..+)?$' \
            || true)
          if [ -n "$tracked" ]; then
            echo "ERROR: secret env file(s) are tracked by git:"
            echo "$tracked"
            exit 1
          fi
          echo "✅ No secret env files tracked."
