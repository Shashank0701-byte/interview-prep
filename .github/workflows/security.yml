name: Security — Audit & Secret Scan

on:
  push:
    branches: [main, dev, feat/**]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/interview-perp-ai/package-lock.json

      - name: Audit backend
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Audit frontend
        working-directory: frontend/interview-perp-ai
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

  pip-audit:
    name: pip audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-training/requirements.txt
      - name: Audit Python dependencies
        working-directory: ai-training
        run: |
          python -m pip install --upgrade pip pip-audit
          # chromadb 1.5.9 is the newest release and is still the last affected
          # version for these advisories. Remove an ignore when a patched release exists.
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/trivy
        with:
          scan-type: fs
          target: .
          skip-dirs: node_modules,chroma_db

  secret-scan:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog on git diff
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  env-file-check:
    name: Check for committed .env files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if secret env files are tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "ERROR: secret env file(s) are tracked by git:"
            echo "$tracked"
            exit 1
          fi
          echo "No secret env files tracked."
