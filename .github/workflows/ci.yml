name: CI — Validate Pull Requests

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/interview-perp-ai/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            ai:
              - 'ai-training/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (Lint + Build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/interview-perp-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/interview-perp-ai/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (Install + Validate)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          find . -name '*.js' -not -path './node_modules/*' -not -path './uploads/*' -print0 | xargs -0 -n1 node --check

  ai-service:
    name: AI Service (Syntax Check)
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Docker validates dependency installation. Avoid downloading the heavy
      # ML stack a second time on every AI-only pull request.
      - run: python -m compileall -q start_rag_service.py study_buddy

  docker-frontend:
    name: Docker (frontend)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend/interview-perp-ai
          push: false
          tags: interview-prep-ai-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  docker-backend:
    name: Docker (backend)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: interview-prep-ai-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  docker-ai:
    name: Docker (AI service)
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./ai-training
          push: false
          tags: interview-prep-ai-ai:ci
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

  status:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [changes, frontend, backend, ai-service, docker-frontend, docker-backend, docker-ai]
    if: always()
    steps:
      - name: Require executed checks to pass
        env:
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          AI: ${{ needs.ai-service.result }}
          DOCKER_FRONTEND: ${{ needs.docker-frontend.result }}
          DOCKER_BACKEND: ${{ needs.docker-backend.result }}
          DOCKER_AI: ${{ needs.docker-ai.result }}
        run: |
          for result in "$FRONTEND" "$BACKEND" "$AI" "$DOCKER_FRONTEND" "$DOCKER_BACKEND" "$DOCKER_AI"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required check failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "All executed checks passed."
