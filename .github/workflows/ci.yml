name: CI — Validate Pull Requests

on:
  pull_request:
    branches:
      - dev
      - main

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  # ============================================================
  # Frontend: Lint + Build
  # ============================================================
  frontend:
    name: Frontend (Lint + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/interview-perp-ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/interview-perp-ai/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  # ============================================================
  # Backend: Install + Syntax Check
  # ============================================================
  backend:
    name: Backend (Install + Validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Check for syntax errors
        run: |
          errors=0
          while IFS= read -r file; do
            if ! node --check "$file" 2>/dev/null; then
              echo "FAILED: $file"
              errors=$((errors+1))
            fi
          done < <(find . -name '*.js' -not -path './node_modules/*' -not -path './uploads/*')
          if [ $errors -gt 0 ]; then
            echo "Found $errors files with syntax errors"
            exit 1
          fi
          echo "All JS files pass syntax check"

  # ============================================================
  # Docker: Validate all images build
  # ============================================================
  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: interview-prep-ai-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/interview-perp-ai
          push: false
          tags: interview-prep-ai-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI service image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-training
          push: false
          tags: interview-prep-ai-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # AI Service: Validate Python dependencies
  # ============================================================
  ai-service:
    name: AI Service (Python deps check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-training

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile start_rag_service.py

  # ============================================================
  # Status Check (combines all results)
  # ============================================================
  status:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [frontend, backend, docker, ai-service]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.frontend.result }}" = "success" ] && \
             [ "${{ needs.backend.result }}" = "success" ] && \
             [ "${{ needs.docker.result }}" = "success" ] && \
             [ "${{ needs.ai-service.result }}" = "success" ]; then
            echo "All CI checks passed!"
          else
            echo "Some checks failed!"
            echo "  Frontend: ${{ needs.frontend.result }}"
            echo "  Backend: ${{ needs.backend.result }}"
            echo "  Docker: ${{ needs.docker.result }}"
            echo "  AI Service: ${{ needs.ai-service.result }}"
            exit 1
          fi

