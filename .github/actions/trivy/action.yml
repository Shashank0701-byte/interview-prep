name: Scan with Trivy
description: |
  Download Trivy from GitHub releases (cached between runs) and scan a
  filesystem path or container image for HIGH/CRITICAL vulnerabilities.

inputs:
  scan-type:
    description: "'fs' for filesystem scan or 'image' for container image scan"
    required: true
  target:
    description: "Filesystem path or image reference to scan"
    required: true
  skip-dirs:
    description: "Comma-separated directories to skip (filesystem scans only)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Cache the Trivy binary so we don't re-download ~40 MB on every job.
    # Cache key is pinned to the exact version — bump the key when upgrading.
    - name: Cache Trivy binary
      id: trivy-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/trivy-bin
        key: trivy-0.76.1-linux-64bit

    - name: Install Trivy (if not cached)
      if: steps.trivy-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        version=0.76.1
        archive="trivy_${version}_Linux-64bit.tar.gz"
        mkdir -p "$RUNNER_TEMP/trivy-bin"
        curl -fsSL -o "$RUNNER_TEMP/$archive" \
          "https://github.com/aquasecurity/trivy/releases/download/v${version}/${archive}"
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/trivy-bin" trivy

    - name: Add Trivy to PATH
      shell: bash
      run: echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

    - name: Scan
      shell: bash
      env:
        SCAN_TYPE: ${{ inputs.scan-type }}
        TARGET:    ${{ inputs.target }}
        SKIP_DIRS: ${{ inputs.skip-dirs }}
      run: |
        args=(--severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed)
        if [ -n "$SKIP_DIRS" ]; then
          IFS=',' read -ra dirs <<< "$SKIP_DIRS"
          for dir in "${dirs[@]}"; do
            args+=(--skip-dirs "$dir")
          done
        fi
        trivy "$SCAN_TYPE" "${args[@]}" "$TARGET"
